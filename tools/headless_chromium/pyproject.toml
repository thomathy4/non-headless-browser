[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "logos-headless-chromium"
version = "0.1.0"
description = "Evidence-preserving, JavaScript-disabled Chromium retrieval prototype"
requires-python = ">=3.11"
dependencies = ["playwright==1.56.0", "bleach==6.2.0", "beautifulsoup4==4.14.3"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["headless_chromium*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
